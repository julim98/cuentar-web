<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unirse a grupo en Cuent-Ar</title>
  <meta name="theme-color" content="#0f172a">
  <meta property="og:title" content="Invitación Segura a Grupo en Cuent-Ar">
  <meta property="og:description" content="Súmate al grupo con cifrado de extremo a extremo para gestionar finanzas y gastos compartidos.">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-weight: 700;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    .code-box {
      background: #0f172a;
      border: 1px dashed #38bdf8;
      border-radius: 12px;
      padding: 14px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #38bdf8;
      margin: 16px 0;
      user-select: all;
    }
    h1 { font-size: 22px; margin: 0 0 10px 0; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; }
    .btn {
      display: block;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: background 0.2s ease;
    }
    .btn-primary {
      background: #00A86B;
    }
    .btn-primary:hover {
      background: #008f5a;
    }
    .btn-secondary {
      background: #2563eb;
    }
    .btn-secondary:hover {
      background: #1d4ed8;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #cbd5e1;
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.05);
    }
    .footer-note { font-size: 12px; color: #64748b; margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">👥 INVITACIÓN SEGURA A GRUPO</div>
    <h1>¡Súmate al grupo en Cuent-Ar!</h1>
    <p id="statusMsg">Elige cómo deseas acceder al grupo compartido:</p>

    <div id="codeDisplay" class="code-box">------</div>

    <div id="actionButtons">
      <button id="openNativeBtn" class="btn btn-primary">Abrir en App Cuent-Ar</button>
      <button id="openWebBtn" class="btn btn-secondary">Abrir en Cuent-Ar Web</button>
      <a id="playStoreBtn" href="https://play.google.com/store/apps/details?id=com.cuentar.cuentar" class="btn btn-outline" target="_blank" rel="noopener">Descargar en Google Play</a>
    </div>

    <p class="footer-note">Los grupos en Cuent-Ar cuentan con cifrado de extremo a extremo (E2EE) para máxima privacidad de tus finanzas.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || params.get('c') || '').toUpperCase();
    
    // Extracción de clave desde query params o desde hash fragment (#key=...)
    let key = params.get('key') || params.get('k') || '';
    if (!key && window.location.hash) {
      const hashStr = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hashStr);
      key = hashParams.get('key') || hashParams.get('k') || hashStr;
      if (key.startsWith('key=')) key = key.substring(4);
      if (key.startsWith('k=')) key = key.substring(2);
    }

    if (code && key) {
      document.getElementById('codeDisplay').textContent = code;
      
      const nativeDeepLink = `cuentar://join?code=${encodeURIComponent(code)}&key=${encodeURIComponent(key)}`;
      const webUrl = `https://cuent-ar.web.app/join?code=${encodeURIComponent(code)}#key=${encodeURIComponent(key)}`;

      document.getElementById('openNativeBtn').onclick = function() {
        window.location.href = nativeDeepLink;
      };

      document.getElementById('openWebBtn').onclick = function() {
        window.location.href = webUrl;
      };

      // Si el usuario está en Android, intentar abrir la app automáticamente
      const isAndroid = /android/i.test(navigator.userAgent);
      if (isAndroid) {
        setTimeout(function() {
          window.location.href = nativeDeepLink;
        }, 200);
      }
    } else if (code && !key) {
      document.getElementById('codeDisplay').textContent = code;
      document.getElementById('statusMsg').innerHTML = '<span style="color: #f87171; font-weight: bold;">⚠️ Enlace incompleto sin clave de cifrado</span><br><br>Para proteger tu privacidad, este grupo cuenta con cifrado de extremo a extremo. Solicítale a quien te invitó que te reenvíe el enlace completo.';
      document.getElementById('actionButtons').style.display = 'none';
    } else {
      document.getElementById('codeDisplay').textContent = 'INVÁLIDO';
      document.getElementById('statusMsg').textContent = 'El enlace no contiene un código de invitación válido.';
      document.getElementById('actionButtons').style.display = 'none';
    }
  </script>
</body>
</html>
